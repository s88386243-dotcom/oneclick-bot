<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Creta Viewer Pro</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0e0e0e;color:#fff}.top{padding:16px;background:#000;position:sticky;top:0;z-index:10;border-bottom:1px solid #222}input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:16px;outline:none}.wrap{padding:12px;max-width:800px;margin:auto}.card{background:#1d1d1f;border:1px solid #2a2a2a;border-radius:14px;padding:14px;margin-bottom:10px}.num{font-size:20px;font-weight:800}.meta{color:#aaa;font-size:13px;margin-top:6px;line-height:1.4;white-space:pre-wrap}.badge{background:#ff6a00;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}button{padding:7px 14px;border-radius:8px;border:0;background:#2e2e2e;color:#fff;font-weight:600}</style></head><body><div class="top"><h2>Creta Viewer 🔥 Pro</h2><input id="s" placeholder="Mobile / Naam / Circle / Address search..."><div style="color:#888;font-size:12px;margin-top:10px" id="c">Loading...</div></div><div class="wrap" id="list"></div><script>let allData=[];async function load(){try{let r=await fetch('./creta.json?v='+Date.now());let j=await r.json();allData=j.Results||j.results||j.data||j;if(!Array.isArray(allData))allData=[allData];render(allData);}catch(e){allData=[{"mobile":"9889662072","name":"Vinod Kumar","fname":"Harilal","address":"Dhakhwa Bazar PO Vill-awra rup Post-barigaon Dhakhva Bhajar Khajni Gorakhpur Uttar Pradesh 273211","circle":"UP EAST","id":"558256805413","email":""}];render(allData);}}function render(d){document.getElementById('c').innerText=d.length+' / '+allData.length+' records';document.getElementById('list').innerHTML=d.slice(0,500).map(x=>`<div class="card"><div class="row"><span class="badge">${x.circle||'IN'}</span><button onclick="navigator.clipboard.writeText('${x.mobile}');this.innerText='Copied ✓'">Copy</button></div><div class="num">${x.mobile}</div><div class="meta">👤 ${x.name||''} ${x.fname?'S/o '+x.fname:''}\n📍 ${x.address||''}\n🆔 ${x.id||''}</div></div>`).join('');}document.getElementById('s').addEventListener('input',e=>{let q=e.target.value.toLowerCase().trim();if(!q)return render(allData);render(allData.filter(o=>(o.mobile+' '+(o.name||'')+' '+(o.fname||'')+' '+(o.address||'')+' '+(o.circle||'')).toLowerCase().includes(q)));});load();</script></body></html>
